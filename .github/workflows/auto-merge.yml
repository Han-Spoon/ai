name: Auto merge

# PR이 열리면 auto-merge를 켜둔다. 실제 머지는 GitHub이 main의 보호 규칙
# (CI `test` 통과 + 승인 1건)을 모두 만족한 시점에 수행한다.
#
# synchronize는 일부러 트리거에서 뺐다 — 누군가 auto-merge를 수동으로 끈 PR에
# 새 커밋이 올라올 때마다 다시 켜버리면 끌 수가 없기 때문이다.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
