name: Deploy (prod)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hanspoon-prod-ai
  ECS_CLUSTER: hanspoon-prod-cluster
  ECS_SERVICE: hanspoon-prod-app
  DEPLOY_LOCK_TABLE: hanspoon-prod-deploy-lock
  CONTAINER_NAME: ai
  HEALTH_URL: https://api.han-spoon.site/actuator/health

jobs:
  deploy:
    if: github.repository == 'Han-Spoon/ai'
    # ARM64 네이티브 러너
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PR CI를 통과했더라도 운영 이미지 생성 직전에 같은 회귀 테스트를 다시 확인한다.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 커밋 SHA 태그
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::12}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "image already exists — skip build/push"
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      # backend/ai 저장소가 같은 ECS 태스크 정의를 동시에 덮어쓰지 않도록 AWS에서 직렬화.
      - name: Acquire ECS deploy lock
        id: deploy-lock
        env:
          LOCK_OWNER: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          LOCK_ERROR_FILE="$RUNNER_TEMP/deploy-lock-error.log"
          for i in $(seq 1 60); do
            NOW="$(date +%s)"
            EXPIRES_AT="$((NOW + 900))"
            ITEM="$(jq -nc \
              --arg owner "$LOCK_OWNER" \
              --argjson expires "$EXPIRES_AT" \
              '{lock_name:{S:"prod-ecs"},owner:{S:$owner},expires_at:{N:($expires|tostring)}}')"
            VALUES="$(jq -nc --argjson now "$NOW" '{":now":{N:($now|tostring)}}')"

            if aws dynamodb put-item \
              --table-name "$DEPLOY_LOCK_TABLE" \
              --item "$ITEM" \
              --condition-expression 'attribute_not_exists(#lock) OR #expires < :now' \
              --expression-attribute-names '{"#lock":"lock_name","#expires":"expires_at"}' \
              --expression-attribute-values "$VALUES" \
              2>"$LOCK_ERROR_FILE"; then
              echo "owner=$LOCK_OWNER" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! grep -q 'ConditionalCheckFailedException' "$LOCK_ERROR_FILE"; then
              echo "Failed to acquire ECS deploy lock:"
              sed -n '1,20p' "$LOCK_ERROR_FILE"
              exit 1
            fi

            echo "Another ECS deployment owns the lock... ($i/60)"
            sleep 5
          done
          echo "Timed out waiting for ECS deploy lock"
          exit 1

      # 패밀리 최신 리비전이 아니라 현재 서비스 리비전에서 출발해 backend 이미지까지 보존.
      - name: Resolve deployed task definition and storage settings
        id: current-task
        run: |
          TASK_DEFINITION_ARN="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"
          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "Failed to resolve deployed task definition"
            exit 1
          fi

          TASK_DEFINITION="$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            --output json)"
          OCR_S3_BUCKET="$(jq -r '
            .containerDefinitions[]
            | select(.name == "backend")
            | .environment[]
            | select(.name == "S3_BUCKET")
            | .value
          ' <<< "$TASK_DEFINITION")"
          if [ -z "$OCR_S3_BUCKET" ] || [ "$OCR_S3_BUCKET" = "null" ]; then
            echo "S3_BUCKET is missing from the deployed backend container"
            exit 1
          fi

          echo "arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$OCR_S3_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ steps.current-task.outputs.arn }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}
          environment-variables: |
            OCR_S3_FETCH_ENABLED=true
            OCR_S3_BUCKET=${{ steps.current-task.outputs.s3_bucket }}
            AWS_REGION=${{ env.AWS_REGION }}
            OCR_REQUEST_BUDGET_SECONDS=16
            OCR_TOTAL_BUDGET_SECONDS=14
            OCR_MAX_CONCURRENT_SCANS=2
            OCR_QUEUE_WAIT_SECONDS=1
            OCR_ENABLE_GPT_POST_PROCESS=false
            OCR_ENABLE_GPT_JUDGMENT=false

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # AI 서비스는 외부 미노출 → 백엔드 actuator 로 태스크 전체 기동 확인
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "healthy"
              exit 0
            fi
            echo "waiting... ($i/30)"
            sleep 10
          done
          exit 1

      - name: Release ECS deploy lock
        if: ${{ always() && steps.deploy-lock.outcome == 'success' }}
        env:
          LOCK_OWNER: ${{ steps.deploy-lock.outputs.owner }}
        run: |
          VALUES="$(jq -nc --arg owner "$LOCK_OWNER" '{":owner":{S:$owner}}')"
          aws dynamodb delete-item \
            --table-name "$DEPLOY_LOCK_TABLE" \
            --key '{"lock_name":{"S":"prod-ecs"}}' \
            --condition-expression '#owner = :owner' \
            --expression-attribute-names '{"#owner":"owner"}' \
            --expression-attribute-values "$VALUES" || true
